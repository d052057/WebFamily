<div class="container my-3 fade-in-out">
  <div class="row justify-content-center">
    <div class="col-md-4">
      <!-- Card for contact info -->
      <div class="card text-center shadow-sm">
        <div class="card-body">
          <h1 class="heading card-title">{{contactInfo.title}}</h1>
          <p class="subTitle card-subtitle">{{contactInfo.subtitle}}</p>
          <div class="contact-text-div">
            <p>
              <a class="contact-detail" href="{{'tel:' + contactInfo.number}}">
                {{contactInfo.number}}
              </a>
            </p>
            <p>
              <a class="contact-detail-email" href="{{'mailto:' + contactInfo.email_address}}">
                {{contactInfo.email_address}}
              </a>
            </p>
            <app-social-media></app-social-media>
          </div>
        </div>
        <div class="card-footer">
          <p>Angular Version {{ angularVersion }}</p>
          <p>Bootstrap Version {{ bootstrapVersion }}</p>
          <p>Bootstrap Icons Version {{ boostrapIconVersion }}</p>
        </div>
      </div>
    </div>
  </div>
</div>
