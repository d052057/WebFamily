<mat-form-field appearance="outline" class="w-100 app-search-box">
  <input appVoice type="search" matInput
         [attr.aria-label]="label"
         placeholder="{{ langSearch() }}"
         [ngModel]="searchVal()"
         (ngModelChange)="onSearch($event)"
         (voiceInput)="onVoiceInput($event)"
         [microphone]="isUserSpeaking"
         [language]="langData[langSelected].code">
  <span matSuffix style="display: flex; align-items: center; padding-right: 1rem;">
    <mat-select (selectionChange)="onLangSelectChange()" [(value)]="langSelected">
      <mat-select-trigger>
        <mat-icon svgIcon="{{ langData[langSelected].icon }}"></mat-icon>
      </mat-select-trigger>
      @for (s of langData; track s; let i = $index) {
      <mat-option [value]="i">
        <mat-icon svgIcon="{{ s.icon }}"></mat-icon> {{ s.display }}
      </mat-option>
      }
    </mat-select>
    <span style="display: flex; padding-left: 1rem;">
      @if (!isUserSpeaking) {
      <mat-icon (click)="checkMic()" class="circle">mic_off</mat-icon>
      }
      @if (isUserSpeaking) {
      <mat-icon (click)="checkMic()" class="circle">mic</mat-icon>
      }
    </span>
  </span>
</mat-form-field>
