<div class="app-container">

  <div class="content-container">
    @if (selectedVideo) {
      <app-video-viewer
        [videoInfo]="selectedVideo">
      </app-video-viewer>
    }

    <div class="video-list">
      <h2>Available Videos</h2>
      <app-media-list [items]="listItems()"
                      [icon]="itemIcon()"
                      [showDuration]="false"
                      [selectedId]="selectedVideo?.id ?? null"
                      emptyMessage="No videos here yet"
                      (select)="selectVideo($event)">
      </app-media-list>
    </div>
  </div>
</div>
