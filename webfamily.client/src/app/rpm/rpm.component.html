<div class="main-container">
    <!-- Left content area (2/3 width) -->
    <div class="content-area">
        @if (selectedPicture) {
        <div>
            <app-rpm-player [dataSource]="dataResult()"
                            [albumTitle]="selectedPicture.folder"
                            [covers]="dataResource()"
                            [selectedCoverId]="selectedPicture.id"
                            (coverSelected)="onPictureSelected($event)"></app-rpm-player>
        </div>
        }
    </div>

    <!-- Right gallery area (1/3 width) -->
    @if (dataResource().length > 0) {
    <app-scrolling-gallery [pictureData]="dataResource()"
                           [selectedId]="selectedPicture?.id ?? null"
                           (pictureSelected)="onPictureSelected($event)">
    </app-scrolling-gallery>
    }
</div>
