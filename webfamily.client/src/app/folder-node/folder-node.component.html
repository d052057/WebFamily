@if (tracks.length) {
<div class="list-group list-group-flush mb-2">
  @for (t of tracks; track trackByTrackId($index, t)) {
  <button type="button"
          class="list-group-item list-group-item-action song-row"
          [class.active]="t.url === playingUrl"
          (click)="trackSelected.emit(t)">
    <span class="track-no">{{ t.trackNumber ?? ($index + 1) }}</span>
    <i class="bi bi-music-note-beamed"></i>
    <span class="flex-grow-1 text-start">{{ t.displayTitle }}</span>
    @if (t.artist) {
    <small class="text-muted me-2">{{ t.artist }}</small>
    }
    <small class="text-muted">{{ t.duration ?? '--:--' }}</small>
  </button>
  }
</div>
}

@if (folders.length) {
<div class="accordion folder-level" [id]="'accordion-' + groupId">
  @for (f of folders; track trackByFolderId($index, f)) {
  <div class="accordion-item">
    <h3 class="accordion-header">
      <button class="accordion-button collapsed" type="button"
              data-bs-toggle="collapse"
              [attr.data-bs-target]="'#collapse-' + f.id">
        <i class="bi bi-folder2 me-2"></i>
        {{ f.name }}
      </button>
    </h3>
    <div [id]="'collapse-' + f.id"
         class="accordion-collapse collapse"
         [attr.data-bs-parent]="'#accordion-' + groupId">
      <div class="accordion-body p-0 pt-2">
        <app-folder-node
          [folders]="f.folders"
          [tracks]="f.tracks"
          [groupId]="f.id"
          [playingUrl]="playingUrl"
          (trackSelected)="trackSelected.emit($event)">
        </app-folder-node>
      </div>
    </div>
  </div>
  }
</div>
}

@if (!tracks.length && !folders.length) {
<div class="empty-state">
  <i class="bi bi-folder-x fs-2 d-block mb-2"></i>
  Nothing here yet
</div>
}
