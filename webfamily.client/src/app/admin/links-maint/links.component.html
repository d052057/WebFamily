<div class="container">
  <h1>Links Maintenance</h1>
  <app-search-box label="Search Tools" (searchChange)="onSearch($event)"></app-search-box>
  <mat-table #table [dataSource]="filteredData()" matSort class="mat-elevation-z8" multiTemplateDataRows>

    <ng-container matColumnDef="title">
      <mat-header-cell *matHeaderCellDef mat-sort-header> Title </mat-header-cell>
      <mat-cell *matCellDef="let row"> {{ row.title }}</mat-cell>
    </ng-container>

    <ng-container matColumnDef="param">
      <mat-header-cell *matHeaderCellDef mat-sort-header> Link </mat-header-cell>
      <mat-cell *matCellDef="let row">
        <a [href]="row.param" target="_blank" rel="noopener noreferrer" class="link-url">{{ row.param }}</a>
      </mat-cell>
    </ng-container>

    <ng-container matColumnDef="action">
      <mat-header-cell *matHeaderCellDef>
        <span><i class='bi bi-plus-circle' (click)="openAddNew()"></i> Add New</span>
      </mat-header-cell>

      <mat-cell *matCellDef="let row; let i=index;">

        <span class='bi bi-pencil-fill edit-button' (click)="openEdit(row)" style="margin-right: 1rem"> Edit</span>
        <span class='bi bi-trash-fill delete-button' (click)="deleteLink(row)"> Delete</span>
      </mat-cell>
    </ng-container>

    <mat-header-row *matHeaderRowDef="displayedColumns"></mat-header-row>
    <mat-row *matRowDef="let row; columns: displayedColumns;"></mat-row>

    <tr class="mat-row no-data-row" *matNoDataRow>
      <td class="mat-cell" colspan="3">No data matching the filter "{{ searchVal() }}"</td>
    </tr>
  </mat-table>
  <mat-paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons></mat-paginator>
</div>
